name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - run: pip install ziglang
      - run: cargo install cargo-zigbuild --locked
      - run: |
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.28
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.28
          mkdir dist
          cp target/x86_64-unknown-linux-gnu/release/otimizador-linux dist/otimizador-linux-x86_64
          cp target/aarch64-unknown-linux-gnu/release/otimizador-linux dist/otimizador-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: otimizador-linux
          path: dist/*
